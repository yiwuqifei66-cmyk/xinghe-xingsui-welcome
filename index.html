<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#060d1c" />
    <meta name="description" content="欢迎来到星禾星穗线下体验课" />
    <title>欢迎来到星禾星穗线下体验课</title>
    <link rel="preload" href="assets/fonts/ZCOOLKuaiLe-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="assets/fonts/preview-fonts.css" />
    <style>
      :root {
        color-scheme: dark;
        --night: #070b15;
        --deep-blue: #15263c;
        --starlight: #fff0d3;
        --gold: #e8b76c;
        --ember: #e76c3f;
        --mist: #d1c8c2;
        --drift-x: 0px;
        --drift-y: 0px;
        /* 翻面卡片可调参数：尺寸、透视距离、动画时长与实色底。 */
        --card-width: 640px;
        --card-height: 500px;
        --card-radius: 24px;
        --card-front: #1b3048;
        --card-back: #f5efe2;
        --flip-perspective: 1400px;
        --flip-duration: 640ms;
        --flip-easing: cubic-bezier(.22, 1, .36, 1);
      }

      *, *::before, *::after { box-sizing: border-box; }
      html { min-height: 100%; background: var(--night); }
      body {
        position: relative;
        margin: 0;
        min-width: 280px;
        color: var(--starlight);
        font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .welcome {
        position: relative;
        isolation: isolate;
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100svh;
        overflow: hidden;
        padding: max(40px, env(safe-area-inset-top)) 24px max(152px, calc(env(safe-area-inset-bottom) + 152px));
        background:
          radial-gradient(ellipse at 50% 37%, rgb(26 40 61 / 78%), transparent 54%),
          radial-gradient(ellipse at 5% 74%, rgb(126 41 25 / 30%), transparent 48%),
          radial-gradient(ellipse at 94% 75%, rgb(125 56 29 / 22%), transparent 42%),
          linear-gradient(180deg, #070b15, #11131f 60%, #100d13);
      }

      /* clip 不创建内部滚动容器，键盘聚焦外部开关时不会把卡片顶部卷走。 */
      @supports (overflow: clip) { .welcome { overflow: clip; } }

      .atmosphere {
        position: absolute;
        z-index: -2;
        inset: -40px;
        pointer-events: none;
        background:
          radial-gradient(ellipse at 50% 70%, rgb(232 183 108 / 17%), transparent 39%),
          radial-gradient(ellipse at 12% 61%, rgb(231 108 63 / 20%), transparent 35%),
          radial-gradient(ellipse at 83% 50%, rgb(134 70 58 / 13%), transparent 33%);
        transform: translate(var(--drift-x), var(--drift-y));
        transition: transform 1.8s cubic-bezier(.2, .7, .3, 1);
      }

      .stars {
        position: absolute;
        inset: 0;
        z-index: -1;
        width: 100%;
        height: 100%;
        pointer-events: none;
        opacity: 1;
      }

      .tech-ground {
        position: absolute;
        z-index: -1;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        opacity: 0;
        animation: scene-in 2.4s .25s ease-out forwards;
        mask-image: linear-gradient(transparent 64%, #000 85%);
      }

      .vignette {
        position: absolute;
        z-index: -1;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at 50% 44%, transparent 37%, rgb(3 5 13 / 32%) 100%);
      }

      .flip-deck {
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr);
        align-items: center;
        gap: 16px 12px;
        width: 100%;
        max-width: var(--card-width);
      }

      .flip-toggle {
        grid-row: 2;
        grid-column: 1;
        width: 22px;
        height: 22px;
        margin: 0;
        accent-color: var(--gold);
        cursor: pointer;
      }

      .flip-control {
        grid-row: 2;
        grid-column: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 44px;
        padding: 8px 12px;
        border-radius: 8px;
        color: #fff0d3;
        font-size: 15px;
        line-height: 1.5;
        cursor: pointer;
      }

      .flip-control svg { width: 24px; height: 24px; flex-shrink: 0; pointer-events: none; }
      .control-back { display: none; }
      .flip-toggle:checked ~ .flip-control .control-front { display: none; }
      .flip-toggle:checked ~ .flip-control .control-back { display: inline; }
      .flip-toggle:focus { outline: 3px solid #fff0d3; outline-offset: 5px; }
      .flip-toggle:focus ~ .flip-control { outline: 2px solid var(--gold); outline-offset: 3px; }
      @supports selector(:focus-visible) {
        .flip-toggle:focus:not(:focus-visible),
        .flip-toggle:focus:not(:focus-visible) ~ .flip-control { outline: none; }
      }
      @media (hover: hover) { .flip-control:hover { background: #25364b; } }

      .flip-stage { grid-row: 1; grid-column: 1 / -1; min-width: 0; }
      .flip-card { display: grid; height: var(--card-height); }
      .card-face {
        grid-area: 1 / 1;
        min-width: 0;
        min-height: 0;
        border-radius: var(--card-radius);
        box-shadow: 0 22px 64px rgb(0 0 0 / 30%);
      }
      .card-front {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: center;
        padding: 26px 24px;
        text-align: center;
        background: var(--card-front);
        overflow: auto;
      }
      .card-back {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 12px;
        padding: 20px;
        background: var(--card-back);
        color: #243652;
        color-scheme: light;
        visibility: hidden;
        pointer-events: none;
      }
      /* 默认是可用的二维切换；checkbox 的 checked 始终是唯一状态源。 */
      .flip-toggle:checked ~ .flip-stage .card-front { visibility: hidden; pointer-events: none; }
      .flip-toggle:checked ~ .flip-stage .card-back { visibility: visible; pointer-events: auto; }
      @supports (height: 1svh) {
        :root { --card-height: clamp(460px, 64svh, 540px); }
      }
      /* 检测通过才启用 3D。父级不能设置 overflow:hidden、filter 或 opacity<1，以免压平 3D。 */
      @supports (transform-style: preserve-3d) and (backface-visibility: hidden) and (perspective: 1000px) {
        .can-flip .flip-stage { perspective: var(--flip-perspective); }
        .can-flip .flip-card {
          transform-style: preserve-3d;
          transform: rotateY(0deg);
          transition: transform var(--flip-duration) var(--flip-easing);
        }
        .can-flip .card-face { backface-visibility: hidden; -webkit-backface-visibility: hidden; visibility: visible; }
        .can-flip .flip-toggle:checked ~ .flip-stage .card-front { visibility: visible; }
        .can-flip .card-back { transform: rotateY(180deg); }
        .can-flip .flip-toggle:checked ~ .flip-stage .flip-card { transform: rotateY(180deg); }
      }

      .route-heading { margin: 0; font-family: "ZCOOL KuaiLe", sans-serif; font-size: 24px; line-height: 1.4; }
      .route-intro { margin: 6px 0 0; font-size: 13px; line-height: 1.6; color: #405475; }
      .route-scroll {
        min-height: 0;
        overflow: auto;
        border-radius: 8px;
        scrollbar-color: #5c74a1 #e4dfd3;
        scrollbar-width: thin;
        background: #e4dfd3;
      }
      .route-scroll:focus { outline: 3px solid #254f95; outline-offset: 3px; }
      .route-figure { margin: 0; }
      .route-image { display: block; width: 100%; max-width: 476px; height: auto; margin-inline: auto; }
      .route-caption { padding: 14px 16px; font-size: 13px; line-height: 1.8; color: #243652; }
      .route-caption p { margin: 0 0 8px; font-weight: 600; }
      .route-caption ol { margin: 0; padding-left: 20px; }
      .route-footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; }
      .route-footer p { margin: 0; color: #405475; font-size: 12px; line-height: 1.6; }
      .route-save { display: inline-flex; align-items: center; min-height: 44px; color: #254f95; font-size: 14px; font-weight: 600; text-underline-offset: 4px; }
      .route-save:focus { outline: 3px solid #254f95; outline-offset: 3px; border-radius: 4px; }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      ::selection { background: #e8b76c; color: #15263c; }

      .opening-mark {
        display: block;
        width: 22px;
        height: 30px;
        margin: 0 auto 18px;
        color: var(--gold);
        opacity: .8;
        pointer-events: none;
      }

      h1 { margin: 0; font-weight: 400; }
      .recipient, .greeting, .brand, .course {
        font-family: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
        font-weight: 400;
      }
      .greeting, .brand, .course {
        display: block;
        line-height: 1.4;
        letter-spacing: .04em;
        overflow-wrap: anywhere;
      }

      .recipient {
        margin: 0 auto 24px;
        max-width: 100%;
        color: var(--mist);
        font-size: 19px;
        line-height: 1.5;
        letter-spacing: .035em;
      }

      .recipient > span { display: block; }

      .recipient-name {
        min-width: 0;
        max-width: 100%;
        margin-top: 8px;
        color: #f6d998;
        font-size: 62px;
        line-height: 1.3;
        letter-spacing: .04em;
        overflow-wrap: anywhere;
      }

      .greeting {
        margin-bottom: 14px;
        font-size: 24px;
        color: #fff1d5;
      }

      .brand {
        font-size: 30px;
        color: #edd4ac;
      }

      .course {
        margin-top: 10px;
        color: #fff1d5;
        font-size: 30px;
      }

      .closing-mark {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        margin: 24px auto 0;
        color: var(--gold);
        opacity: .8;
        pointer-events: none;
      }

      .closing-mark::before, .closing-mark::after {
        content: "";
        width: clamp(35px, 5vw, 62px);
        height: 1px;
        background: linear-gradient(90deg, transparent, rgb(232 183 108 / 60%));
      }

      .closing-mark::after { transform: rotate(180deg); }
      .closing-mark svg { width: 8px; height: 8px; }

      .pet-companion {
        position: absolute;
        z-index: 10;
        right: max(24px, env(safe-area-inset-right));
        bottom: max(18px, env(safe-area-inset-bottom));
        width: clamp(100px, 10vw, 132px);
      }

      .pet-button {
        display: block;
        width: 100%;
        padding: 0;
        border: 0;
        border-radius: 22px;
        background: transparent;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: transform 240ms cubic-bezier(.22, 1, .36, 1);
      }

      .pet-button img {
        display: block;
        width: 100%;
        height: auto;
        user-select: none;
        filter: drop-shadow(0 8px 18px rgb(39 121 212 / 24%));
      }

      .pet-button:active { transform: scale(.96); }
      .pet-button:focus-visible { outline: 2px solid var(--gold); outline-offset: 6px; }
      @media (hover: hover) { .pet-button:hover { transform: translateY(-4px); } }

      .pet-speech {
        position: absolute;
        right: 8px;
        bottom: calc(100% + 10px);
        width: max-content;
        max-width: calc(100vw - 48px);
        padding: 13px 18px;
        border: 1px solid rgb(179 211 243 / 85%);
        border-radius: 18px;
        background: #edf5ff;
        color: #253d5c;
        box-shadow: 0 8px 30px rgb(0 0 0 / 24%), 0 0 24px rgb(83 155 233 / 10%);
        font-size: 15px;
        line-height: 1.6;
        animation: speech-in 240ms cubic-bezier(.22, 1, .36, 1) both;
        transform-origin: calc(100% - 32px) 100%;
      }

      .pet-speech[hidden] { display: none; }
      .pet-speech::after {
        content: "";
        position: absolute;
        right: 29px;
        bottom: -6px;
        width: 11px;
        height: 11px;
        background: #edf5ff;
        border-right: 1px solid rgb(179 211 243 / 85%);
        border-bottom: 1px solid rgb(179 211 243 / 85%);
        transform: rotate(45deg);
      }

      @keyframes speech-in {
        from { opacity: 0; transform: translateY(7px) scale(.94); }
        to { opacity: 1; transform: none; }
      }

      @keyframes scene-in { from { opacity: 0; } to { opacity: .8; } }

      @media (max-width: 600px) {
        .welcome {
          padding-top: max(24px, env(safe-area-inset-top));
          padding-bottom: max(184px, calc(env(safe-area-inset-bottom) + 184px));
          padding-inline: 20px;
        }
        .card-front { padding-inline: 18px; }
        .card-back { padding: 14px; gap: 10px; }
        .route-heading { font-size: 22px; }
        .pet-companion {
          right: max(14px, env(safe-area-inset-right));
          bottom: max(12px, env(safe-area-inset-bottom));
          width: 88px;
        }
        .pet-speech { font-size: 14px; padding: 11px 15px; }
      }

      @media (max-height: 700px) and (max-width: 600px) {
        .welcome {
          padding-top: max(16px, env(safe-area-inset-top));
          padding-bottom: max(188px, calc(env(safe-area-inset-bottom) + 188px));
        }
        .opening-mark { margin-bottom: 14px; }
        .recipient { margin-bottom: 20px; }
        .recipient-name { font-size: min(62px, 19vw); }
        .greeting { margin-bottom: 16px; }
        .closing-mark { margin-top: 16px; }
      }

      @media (max-height: 500px) and (min-width: 601px) {
        .welcome { padding-top: 28px; }
        .opening-mark { width: 20px; height: 26px; margin-bottom: 12px; }
        .recipient { margin-bottom: 8px; font-size: 17px; }
        .recipient-name { font-size: 48px; }
        .greeting { margin-bottom: 10px; font-size: 22px; }
        .brand, .course { font-size: 26px; }
        .closing-mark { margin-top: 18px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
        .tech-ground { opacity: .8; }
        /* 降低动态效果时取消空间旋转，仍保留 checkbox 的正反面状态切换。 */
        .can-flip .flip-card, .can-flip .card-back { transform: none; }
        .can-flip .flip-toggle:checked ~ .flip-stage .flip-card { transform: none; }
        .can-flip .card-back { visibility: hidden; }
        .can-flip .flip-toggle:checked ~ .flip-stage .card-front { visibility: hidden; }
        .can-flip .flip-toggle:checked ~ .flip-stage .card-back { visibility: visible; }
      }
    </style>
  </head>
  <body>
    <main class="welcome" aria-label="星禾星穗线下体验课欢迎页">
      <div class="atmosphere" aria-hidden="true"></div>
      <canvas class="stars" aria-hidden="true"></canvas>
      <svg class="tech-ground" viewBox="0 0 1440 900" preserveAspectRatio="none" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="ground-light" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e8b76c" stop-opacity=".08" />
            <stop offset="1" stop-color="#e76c3f" stop-opacity=".32" />
          </linearGradient>
        </defs>
        <g stroke="url(#ground-light)" stroke-width="1">
          <path d="M720 580 -540 900M720 580 -330 900M720 580 -120 900M720 580 90 900M720 580 300 900M720 580 510 900M720 580 720 900M720 580 930 900M720 580 1140 900M720 580 1350 900M720 580 1560 900M720 580 1770 900M720 580 1980 900" />
          <path d="M0 615H1440M0 632H1440M0 658H1440M0 696H1440M0 750H1440M0 824H1440" />
        </g>
      </svg>
      <div class="vignette" aria-hidden="true"></div>

      <section class="flip-deck" aria-label="欢迎卡片与到校路线">
        <!-- 不隐藏、不用 div 模拟：Tab 聚焦后空格直接切换原生 checked。 -->
        <input class="flip-toggle" type="checkbox" id="route-toggle" aria-label="显示路线指引，取消勾选返回欢迎页" aria-controls="welcome-face route-face" aria-describedby="flip-help" />
        <div class="flip-stage">
          <div class="flip-card">
            <section class="card-face card-front" id="welcome-face" aria-label="欢迎页面">
        <svg class="opening-mark" viewBox="0 0 28 40" fill="none" aria-hidden="true">
          <path d="M14 1C14 14 11 18 2 20C11 22 14 26 14 39C14 26 17 22 26 20C17 18 14 14 14 1Z" stroke="currentColor" stroke-width=".8" />
          <circle cx="14" cy="20" r="1.4" fill="currentColor" />
        </svg>
        <p class="recipient"><span>亲爱的</span><span class="recipient-name" id="attendee-name">小明</span></p>
        <h1 aria-label="欢迎来到星禾星穗线下体验课">
          <span class="greeting">欢迎来到</span>
          <span class="brand">星禾星穗</span>
          <span class="course">线下体验课</span>
        </h1>
        <div class="closing-mark" aria-hidden="true">
          <svg viewBox="0 0 8 8"><path d="M4 0 5 3 8 4 5 5 4 8 3 5 0 4 3 3Z" fill="currentColor" /></svg>
        </div>
            </section>
            <section class="card-face card-back" id="route-face" aria-labelledby="route-heading">
              <header>
                <h2 class="route-heading" id="route-heading">广州校区路线指引</h2>
                <p class="route-intro">大学城北 F 口出站，前往青蓝街 26，再乘电梯到 8 楼前台。</p>
              </header>
              <div class="route-scroll" tabindex="0" role="region" aria-label="完整路线图，可使用方向键上下滚动">
                <figure class="route-figure">
                  <img class="route-image" src="assets/guangzhou-route-guide.png" width="476" height="1174" alt="广州校区路线指引，共六步。文字版说明在图片下方。" />
                  <figcaption class="route-caption">
                    <p>按图中六步前往校区</p>
                    <ol>
                      <li>乘地铁 4 号或 12 号线到大学城北，走 F 口。</li>
                      <li>出地铁站后左转，到马路对面。</li>
                      <li>看到“青蓝街 26”后，往里面走。</li>
                      <li>进门后往右前方走，路口右转。</li>
                      <li>经过闸机后，乘电梯上 8 楼。</li>
                      <li>出电梯后，到达星禾双语广州校区前台。</li>
                    </ol>
                  </figcaption>
                </figure>
              </div>
              <footer class="route-footer">
                <p>上下滑动查看完整路线图</p>
                <a class="route-save" href="assets/guangzhou-route-guide.png" download="广州校区路线指引.png">保存路线图</a>
              </footer>
            </section>
          </div>
        </div>
        <label class="flip-control" for="route-toggle">
          <span class="control-front">查看路线指引</span><span class="control-back">返回欢迎页面</span>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 8h10a4 4 0 0 1 0 8H9M5 8l3-3M5 8l3 3M9 16l3-3M9 16l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </label>
        <p class="sr-only" id="flip-help">点击开关或文字翻面。键盘可使用 Tab 聚焦开关、空格切换。路线图区域可用方向键滚动。</p>
      </section>
    </main>
    <aside class="pet-companion" aria-label="星小禾">
      <div class="pet-speech" id="pet-speech" role="status" aria-live="polite" hidden>星小禾欢迎你呀</div>
      <button class="pet-button" type="button" aria-label="和星小禾打招呼" aria-controls="pet-speech" aria-expanded="false">
        <picture>
          <source media="(prefers-reduced-motion: reduce)" srcset="assets/blue-star-spirit-still.png" />
          <img src="assets/blue-star-spirit-animated.webp" width="384" height="488" alt="星小禾，戴着星星帽子的蓝色小精灵" draggable="false" />
        </picture>
      </button>
    </aside>
    <script>
      (() => {
        const toggle = document.querySelector('#route-toggle');
        const front = document.querySelector('#welcome-face');
        const back = document.querySelector('#route-face');
        const supportsInert = 'inert' in HTMLElement.prototype;
        const supports3D = typeof CSS !== 'undefined' && typeof CSS.supports === 'function'
          && CSS.supports('transform-style', 'preserve-3d')
          && CSS.supports('backface-visibility', 'hidden')
          && CSS.supports('perspective', '1000px');
        const savedTabIndex = new WeakMap();

        function setFaceActive(face, active) {
          face.setAttribute('aria-hidden', String(!active));
          if (supportsInert) {
            face.inert = !active;
          } else {
            // 旧浏览器没有 inert 时，仍让背面的链接和滚动区退出 Tab 顺序。
            for (const element of face.querySelectorAll('a, button, input, select, textarea, [tabindex]')) {
              if (!active) {
                if (!savedTabIndex.has(element)) savedTabIndex.set(element, element.getAttribute('tabindex'));
                element.setAttribute('tabindex', '-1');
              } else if (savedTabIndex.has(element)) {
                const value = savedTabIndex.get(element);
                if (value === null) element.removeAttribute('tabindex');
                else element.setAttribute('tabindex', value);
                savedTabIndex.delete(element);
              }
            }
          }
        }

        function syncFaces() {
          setFaceActive(front, !toggle.checked);
          setFaceActive(back, toggle.checked);
        }

        toggle.addEventListener('change', syncFaces);
        window.addEventListener('pageshow', syncFaces);
        syncFaces();
        if (supports3D) document.documentElement.classList.add('can-flip');
        // JS 不控制 transform，也不另存布尔状态：CSS 只读取 :checked。
      })();

      (() => {
        const button = document.querySelector('.pet-button');
        const speech = document.querySelector('.pet-speech');

        function setSpeechOpen(open) {
          speech.hidden = !open;
          button.setAttribute('aria-expanded', String(open));
        }

        button.addEventListener('click', () => setSpeechOpen(speech.hidden));
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') setSpeechOpen(false);
        });
      })();

      (() => {
        const scene = document.querySelector('.welcome');
        const canvas = document.querySelector('.stars');
        const context = canvas.getContext('2d');
        if (!context) return;

        const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
        let width = 0;
        let height = 0;
        let stars = [];
        let frameId = 0;
        let lastFrame = 0;
        let elapsed = 0;

        function resize() {
          const bounds = scene.getBoundingClientRect();
          width = bounds.width;
          height = bounds.height;
          const ratio = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.round(width * ratio);
          canvas.height = Math.round(height * ratio);
          context.setTransform(ratio, 0, 0, ratio, 0, 0);
          const count = Math.min(118, Math.max(48, Math.round(width * height / 12000)));
          stars = Array.from({ length: count }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 1.2 + .35,
            brightness: Math.random() * .45 + .16,
            phase: Math.random() * Math.PI * 2,
            depth: Math.random() * .8 + .3,
            warm: Math.random() > .35,
          }));
          draw();
        }

        function orbitPoint(angle, offset = 0) {
          const slowLift = motionPreference.matches ? 0 : Math.sin(elapsed * .00022) * height * .003;
          return {
            x: width * (.5 + Math.cos(angle) * .67),
            y: height * (.74 + Math.sin(angle) * .092 - Math.cos(angle) * .055 + offset) + slowLift,
          };
        }

        function traceOrbit(offset) {
          context.beginPath();
          for (let pointIndex = 0; pointIndex <= 180; pointIndex++) {
            const point = orbitPoint(pointIndex / 180 * Math.PI * 2, offset);
            if (pointIndex === 0) context.moveTo(point.x, point.y);
            else context.lineTo(point.x, point.y);
          }
        }

        function drawEnergy() {
          const goldLight = context.createLinearGradient(0, height * .8, width, height * .65);
          goldLight.addColorStop(0, 'rgba(231,91,43,.36)');
          goldLight.addColorStop(.24, 'rgba(243,148,65,.85)');
          goldLight.addColorStop(.5, 'rgba(255,229,172,1)');
          goldLight.addColorStop(.75, 'rgba(232,168,87,.8)');
          goldLight.addColorStop(1, 'rgba(231,108,63,.25)');
          context.save();
          context.globalCompositeOperation = 'screen';
          traceOrbit(0);
          context.strokeStyle = goldLight;
          context.shadowColor = 'rgba(232,149,59,.7)';
          context.shadowBlur = 24;
          context.globalAlpha = .08;
          context.lineWidth = 28;
          context.stroke();
          context.globalAlpha = .2;
          context.lineWidth = 5;
          context.stroke();
          context.globalAlpha = .75;
          context.shadowBlur = 7;
          context.lineWidth = 1.1;
          context.stroke();

          traceOrbit(.018);
          context.globalAlpha = .18;
          context.lineWidth = .7;
          context.shadowBlur = 0;
          context.stroke();

          // 光点沿同一条星环移动，轨迹与背景形成一致的空间关系。
          const time = motionPreference.matches ? 0 : elapsed * .000065;
          for (let index = 0; index < 7; index++) {
            const angle = time + index * Math.PI * 2 / 7;
            const point = orbitPoint(angle);
            const foreground = (Math.sin(angle) + 1) / 2;
            context.globalAlpha = .3 + foreground * .55;
            context.shadowBlur = 15;
            context.shadowColor = '#e8b76c';
            context.fillStyle = '#ffedc3';
            context.beginPath();
            context.arc(point.x, point.y, .9 + foreground * .8, 0, Math.PI * 2);
            context.fill();
            context.shadowBlur = 0;
            for (let trail = 1; trail <= 8; trail++) {
              const tailPoint = orbitPoint(angle - trail * .008);
              context.globalAlpha = (1 - trail / 9) * .18;
              context.beginPath();
              context.arc(tailPoint.x, tailPoint.y, .8, 0, Math.PI * 2);
              context.fill();
            }
          }

          // 柔和的橙红流光穿过下方，控制点缓慢变化，避免机械旋转感。
          const flow = motionPreference.matches ? 0 : Math.sin(elapsed * .00016) * height * .018;
          context.beginPath();
          context.moveTo(-width * .1, height * .85);
          context.bezierCurveTo(width * .2, height * .56 + flow, width * .63, height * .92 - flow, width * 1.1, height * .55);
          context.strokeStyle = goldLight;
          context.globalAlpha = .14;
          context.lineWidth = 12;
          context.shadowBlur = 22;
          context.shadowColor = '#e76c3f';
          context.stroke();
          context.globalAlpha = .28;
          context.lineWidth = .9;
          context.shadowBlur = 0;
          context.stroke();
          context.restore();
        }

        function draw() {
          context.clearRect(0, 0, width, height);
          for (const star of stars) {
            // 留出标题区：装饰始终退到文字之后。
            const starY = motionPreference.matches ? star.y : (star.y - elapsed * .002 * star.depth % height + height) % height;
            const nearTitle = Math.abs(star.x - width / 2) < width * .3 && starY > height * .22 && starY < height * .62;
            const twinkle = motionPreference.matches ? 1 : .8 + Math.sin(elapsed * .0005 + star.phase) * .2;
            const opacity = star.brightness * twinkle * (nearTitle ? .25 : 1);
            context.beginPath();
            context.arc(star.x, starY, star.radius, 0, Math.PI * 2);
            context.fillStyle = star.warm ? `rgba(246,195,122,${opacity})` : `rgba(174,195,225,${opacity})`;
            context.fill();
            if (star.radius > 1.25 && !nearTitle) {
              context.strokeStyle = `rgba(255,220,163,${opacity * .4})`;
              context.lineWidth = .6;
              context.beginPath();
              context.moveTo(star.x - 3, starY);
              context.lineTo(star.x + 3, starY);
              context.moveTo(star.x, starY - 3);
              context.lineTo(star.x, starY + 3);
              context.stroke();
            }
          }
          drawEnergy();
        }

        function animate(timestamp) {
          if (document.hidden || motionPreference.matches) { frameId = 0; return; }
          if (!lastFrame) lastFrame = timestamp;
          const delta = timestamp - lastFrame;
          if (delta >= 1000 / 24) {
            elapsed += Math.min(delta, 80);
            lastFrame = timestamp;
            draw();
          }
          frameId = requestAnimationFrame(animate);
        }

        function syncMotion() {
          cancelAnimationFrame(frameId);
          frameId = 0;
          lastFrame = 0;
          if (!document.hidden && !motionPreference.matches) frameId = requestAnimationFrame(animate);
          else draw();
          if (motionPreference.matches) {
            scene.style.setProperty('--drift-x', '0px');
            scene.style.setProperty('--drift-y', '0px');
          }
        }

        scene.addEventListener('pointermove', (event) => {
          if (event.pointerType !== 'mouse' || motionPreference.matches) return;
          const bounds = scene.getBoundingClientRect();
          scene.style.setProperty('--drift-x', `${((event.clientX - bounds.left) / width - .5) * 14}px`);
          scene.style.setProperty('--drift-y', `${((event.clientY - bounds.top) / height - .5) * 10}px`);
        }, { passive: true });
        scene.addEventListener('pointerleave', () => {
          scene.style.setProperty('--drift-x', '0px');
          scene.style.setProperty('--drift-y', '0px');
        });
        window.addEventListener('resize', resize, { passive: true });
        document.addEventListener('visibilitychange', syncMotion);
        if (typeof motionPreference.addEventListener === 'function') motionPreference.addEventListener('change', syncMotion);
        else if (typeof motionPreference.addListener === 'function') motionPreference.addListener(syncMotion);
        resize();
        syncMotion();
      })();
    </script>
  </body>
</html>
